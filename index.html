<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetaMask Custom Layout</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #fdf5f0; /* لون الخلفية الأصلي */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            padding: 40px 20px;
            justify-content: space-between; /* يوزع العناصر: أعلى، وسط، أسفل */
            align-items: center;
        }

        /* 1. الاسم في الأعلى */
        .header-name img {
            width: 160px;
            height: auto;
            margin-top: 10px;
        }

        /* 2. الأزرار في الوسط */
        .center-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1; /* تأخذ المساحة المتبقية لتتوسط الشاشة */
            justify-content: center;
        }

        .btn {
            width: 100%;
            height: 58px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-white {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .btn-black {
            background-color: #000000;
            color: #ffffff;
        }

        /* 3. الثعلب في الأسفل */
        .footer-fox img {
            width: 240px; /* حجم الثعلب في الأسفل */
            height: auto;
            margin-bottom: -40px; /* لجعله يظهر وكأنه يخرج من أسفل الشاشة */
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header-name">
            <img src="https://i.ibb.co/TxBwJwkR/E7961-A44-6-F80-4-C61-ABB2-1114843-BA52-A.png" alt="MetaMask Name">
        </div>

        <div class="center-buttons">
            <a href="#" class="btn btn-white">Créer un nouveau portefeuille</a>
            <a href="#" class="btn btn-black">J’ai déjà un portefeuille</a>
        </div>

        <div class="footer-fox">
            <img src="https://i.ibb.co/MDxwTKnF/00-D9-CEEE-C3-F4-489-F-BF98-84-AAC47-A6-ED5.png" alt="MetaMask Fox">
        </div>
    </div>

</body>
</html>
