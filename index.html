<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetaMask Ultra Precise</title>
    <style>
        /* استيراد خط هندسي ثقيل يشبه شعار ميتا ماسك */
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@800&family=Inter:wght@600&display=swap');

        :root {
            /* الألوان المستخرجة بدقة من الصورة */
            --bg-color: #fdf5f0;           /* لون الخلفية الكريمي */
            --brand-purple: #241151;       /* بنفسجي MetaMask الداكن */
            --btn-white: #ffffff;
            --btn-black: #000000;
            --fox-main: #e27625;           /* البرتقالي الأساسي */
            --fox-dark: #763d16;           /* البني الداكن للأذن اليسرى */
            --fox-light: #f6851b;          /* البرتقالي الفاتح للمنتصف */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .phone-screen {
            width: 100%;
            max-width: 414px; /* عرض شاشة قياسي */
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 0 25px;
        }

        /* تنسيق اللوجو - الدقة هنا في المسافة بين الحروف والأسطر */
        .logo-container {
            margin-top: 25%;
            text-align: center;
            user-select: none;
        }

        .logo-text {
            font-family: 'Lexend', sans-serif;
            color: var(--brand-purple);
            font-size: 78px;
            line-height: 0.82; /* لجعل الكلمتين متقاربتين جداً */
            letter-spacing: -3px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
        }

        /* تنسيق الأزرار */
        .button-wrapper {
            width: 100%;
            margin-top: auto;
            margin-bottom: 140px; /* مساحة للأذنين في الأسفل */
            z-index: 10;
        }

        .btn {
            width: 100%;
            height: 58px;
            border-radius: 12px; /* زوايا منحنية بدقة */
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-white {
            background-color: var(--btn-white);
            color: #000;
        }

        .btn-black {
            background-color: var(--btn-black);
            color: #fff;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* تصميم الثعلب في الأسفل (بدقة هندسية 100%) */
        .fox-footer {
            position: absolute;
            bottom: -5px;
            width: 120%;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
        }

        .ear-left {
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-bottom: 180px solid var(--fox-dark);
            transform: rotate(-12deg) translate(55px, 20px);
        }

        .ear-right {
            width: 0;
            height: 0;
            border-right: 150px solid transparent;
            border-bottom: 180px solid var(--fox-main);
            transform: rotate(12deg) translate(-55px, 20px);
        }

        .ear-center {
            position: absolute;
            bottom: 0;
            width: 80px;
            height: 50px;
            background: #f6851b;
            clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="phone-screen">
        <div class="logo-container">
            <div class="logo-text">
                <span>Meta</span>
                <span>Mask</span>
            </div>
        </div>

        <div class="button-wrapper">
            <button class="btn btn-white">Créer un nouveau portefeuille</button>
            <button class="btn btn-black">J’ai déjà un portefeuille</button>
        </div>

        <div class="fox-footer">
            <div class="ear-left"></div>
            <div class="ear-center"></div>
            <div class="ear-right"></div>
        </div>
    </div>

</body>
</html>
