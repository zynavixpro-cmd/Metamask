<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaMask Fix</title>
    <style>
        /* إعدادات الصفحة الأساسية لضمان عدم وجود هوامش */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #fdf5f0; /* اللون الكريمي المطابق للصورة */
            font-family: sans-serif;
            overflow: hidden;
        }

        /* حاوية الشاشة الرئيسية */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* توزيع العناصر: فوق، وسط، تحت */
            height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* 1. قسم الشعار في الأعلى */
        .logo-top {
            text-align: center;
            margin-top: 20px;
        }
        .logo-top img {
            width: 200px; /* حجم الشعار العلوي */
            height: auto;
        }

        /* 2. قسم الثعلب في المنتصف */
        .fox-center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1; /* يأخذ المساحة الوسطى بالكامل */
        }
        .fox-head {
            width: 250px;
            height: auto;
        }

        /* 3. قسم الأزرار في الأسفل */
        .buttons-bottom {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }

        .btn {
            width: 100%;
            height: 55px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-white {
            background-color: #ffffff;
            color: #000;
        }

        .btn-black {
            background-color: #000000;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="logo-top">
            <img src="https://i.ibb.co/HfY8YZY5/CDDEF7-D4-B6-C6-4-B7-D-BCDE-C1-FCB3191133.jpg" alt="MetaMask Logo">
        </div>

        <div class="fox-center">
            <svg width="200" height="100" viewBox="0 0 200 100">
                <path d="M20 100 L100 20 L180 100" fill="none" stroke="#e27625" stroke-width="0" />
                <polygon points="20,100 100,20 60,100" fill="#763d16" />
                <polygon points="180,100 100,20 140,100" fill="#e27625" />
            </svg>
        </div>

        <div class="buttons-bottom">
            <button class="btn btn-white">Créer un nouveau portefeuille</button>
            <button class="btn btn-black">J’ai déjà un portefeuille</button>
        </div>
    </div>

</body>
</html>
