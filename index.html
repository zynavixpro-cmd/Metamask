<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfect UI Clone - Full Layout</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /* اللون الكريمي المطابق للصورة الأصلية */
            background-color: #F9F3F0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* 1. شعار المنتصف العلوي */
        .top-logo-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-top: 40px;
        }

        .top-logo-container img {
            width: 110px;
            height: auto;
            object-fit: contain;
        }

        /* 2. حاوية الأزرار (وسط الأسفل) */
        .buttons-wrapper {
            width: 100%;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
        }

        .btn {
            width: 100%;
            height: 68px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 17px;
            font-weight: 500;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-white {
            background-color: #FFFFFF;
            color: #000000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .btn-black {
            background-color: #000000;
            color: #FFFFFF;
        }

        /* 3. الشعار السفلي الجديد */
        .bottom-logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 0 40px 0; /* مساحة كافية في الأسفل */
        }

        .bottom-logo-container img {
            width: 80px; /* مقاس أصغر قليلاً ليناسب التذييل */
            height: auto;
            opacity: 0.8; /* شفافية بسيطة لجعله يبدو كعلامة تجارية هادئة */
        }

        .btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="top-logo-container">
        <img src="https://i.ibb.co/hRXn20JF/B347-C247-60-A0-4-CC2-8-D79-1-AE7-CAFEF980.png" alt="Top Logo">
    </div>

    <div class="buttons-wrapper">
        <button class="btn btn-white">Créer un nouveau portefeuille</button>
        <button class="btn btn-black">J'ai déjà un portefeuille</button>
    </div>

    <div class="bottom-logo-container">
        <img src="https://i.ibb.co/7dxnxHSd/2-E969-B8-A-4-E80-466-A-94-D0-98645-A2-C5296.png" alt="Bottom Logo">
    </div>

</body>
</html>
