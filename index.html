<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetaMask UI Clean</title>
    <style>
        /* استيراد خط نظيف للأزرار */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            height: 100%;
            width: 100%;
            /* اللون الكريمي الدقيق للخلفية من الصورة الأصلية */
            background-color: #fdf5f0; 
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px; /* مقاس عرض الهاتف المثالي */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* لتوزيع العناصر بين الأعلى والأسفل */
            padding: 80px 24px 60px 24px;
            position: relative;
        }

        /* تنسيق الشعار (الصورة التي أرسلتها) */
        .header-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1; /* تجعل الشعار يأخذ المساحة العلوية المتاحة */
        }

        .logo-image {
            width: 85%; /* حجم الشعار بالنسبة لعرض الشاشة */
            max-width: 300px;
            height: auto;
            object-fit: contain;
        }

        /* تنسيق قسم الأزرار في الأسفل */
        .footer-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px; /* المسافة بين الأزرار */
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            height: 54px;
            border-radius: 100px; /* أزرار دائرية الأطراف كما في النسخ الحديثة */
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        /* الزر الأبيض */
        .btn-white {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* الزر الأسود */
        .btn-black {
            background-color: #000000;
            color: #ffffff;
        }

        /* تأثير عند الضغط */
        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <img src="https://i.ibb.co/HfY8YZY5/CDDEF7-D4-B6-C6-4-B7-D-BCDE-C1-FCB3191133.jpg" 
                 alt="MetaMask Logo" 
                 class="logo-image">
        </div>

        <div class="footer-section">
            <button class="btn btn-white">Créer un nouveau portefeuille</button>
            <button class="btn btn-black">J’ai déjà un portefeuille</button>
        </div>
    </div>

</body>
</html>
