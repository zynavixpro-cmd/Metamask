<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetaMask Fix Background</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            background-color: #fdf5f0; /* لون احتياطي */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* الطبقة الأساسية للخلفية */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* استخدمت الرابط المباشر للصورة هنا */
            background-image: url('https://i.ibb.co/ccbpfJRc/IMG-4227.jpg');
            background-size: cover; 
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* طبقة الأزرار فوق الخلفية */
        .ui-layer {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* وضع الأزرار في السنتر */
            align-items: center;
            padding: 0 30px;
        }

        .button-group {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* ارفع أو انزل الأزرار من هنا لتناسب فراغ الصورة */
            margin-top: 150px; 
        }

        .btn {
            width: 100%;
            height: 56px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-white {
            background-color: #ffffff;
            color: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .btn-black {
            background-color: #000000;
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <div class="ui-layer">
        <div class="button-group">
            <a href="#" class="btn btn-white">Créer un nouveau portefeuille</a>
            <a href="#" class="btn btn-black">J’ai déjà un portefeuille</a>
        </div>
    </div>

</body>
</html>
