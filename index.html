<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetaMask Pro UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* منع التمرير للحفاظ على شكل التطبيق */
            background-color: #fdf5f0; /* لون احتياطي مطابق للخلفية */
            font-family: 'Inter', sans-serif;
        }

        /* حاوية الخلفية لضبط مقاس 1991x4090 */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/ccbpfJRc/IMG-4227.jpg');
            background-size: cover; /* تجعل الصورة تغطي كامل الشاشة مهما كان نوع الهاتف */
            background-position: center top; /* التركيز على الجزء العلوي حيث يوجد الشعار */
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* حاوية الأزرار في وسط الشاشة */
        .content-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* توسيط عمودي */
            align-items: center;    /* توسيط أفقي */
            padding: 0 25px;
        }

        .button-group {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* إزاحة بسيطة للأسفل لضمان عدم تغطية كلمة MetaMask */
            margin-top: 120px; 
        }

        .btn {
            width: 100%;
            height: 58px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-white {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .btn-black {
            background-color: #000000;
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.98);
        }

    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="content-wrapper">
        <div class="button-group">
            <a href="#" class="btn btn-white">Créer un nouveau portefeuille</a>
            <a href="#" class="btn btn-black">J’ai déjà un portefeuille</a>
        </div>
    </div>

</body>
</html>
