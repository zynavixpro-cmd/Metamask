<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetaMask Optimized Layout</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            background-color: #fdf5f0; /* اللون الكريمي الأصلي */
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        /* ضبط مقاس الاسم في الأعلى ليكون واضحاً وغير صغير */
        .brand-name img {
            width: 200px; /* المقاس المثالي للاسم */
            height: auto;
        }

        /* وضع الأزرار في السنتر (الوسط) */
        .mid-section {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
            justify-content: center;
        }

        .btn {
            width: 100%;
            height: 60px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-white { background-color: #fff; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-black { background-color: #000; color: #fff; }

        /* ضبط مقاس الثعلب السفلي ليكون كبيراً وواضحاً */
        .fox-footer img {
            width: 280px; /* تكبير الثعلب ليتناسب مع النتيجة المطلوبة */
            height: auto;
            margin-bottom: -20px; /* لجعله يخرج من حافة الشاشة */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-name">
            <img src="https://i.ibb.co/TxBwJwkR/E7961-A44-6-F80-4-C61-ABB2-1114843-BA52-A.png" alt="MetaMask">
        </div>

        <div class="mid-section">
            <button class="btn btn-white">Créer un nouveau portefeuille</button>
            <button class="btn btn-black">J’ai déjà un portefeuille</button>
        </div>

        <div class="fox-footer">
            <img src="https://i.ibb.co/MDxwTKnF/00-D9-CEEE-C3-F4-489-F-BF98-84-AAC47-A6-ED5.png" alt="Fox Logo">
        </div>
    </div>

</body>
</html>
