<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetaMask UI Custom</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            /* جعل الصورة التي أرسلتها هي الخلفية الكاملة للموقع */
            background-image: url('https://i.ibb.co/HfY8YZY5/CDDEF7-D4-B6-C6-4-B7-D-BCDE-C1-FCB3191133.jpg');
            background-size: cover; /* تجعل الخلفية تغطي الشاشة بالكامل */
            background-position: center; /* توسيط الخلفية */
            background-repeat: no-repeat;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center; /* توسيط الأزرار في نص الشاشة */
        }

        .button-container {
            width: 100%;
            max-width: 350px; /* عرض الأزرار */
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            /* إضافة إزاحة بسيطة للأسفل إذا كنت تريدها تحت الشعار تماماً */
            margin-top: 150px; 
        }

        .btn {
            width: 100%;
            height: 56px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        /* الزر الأبيض */
        .btn-white {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* الزر الأسود */
        .btn-black {
            background-color: #000000;
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="button-container">
        <button class="btn btn-white">Créer un nouveau portefeuille</button>
        <button class="btn btn-black">J’ai déjà un portefeuille</button>
    </div>

</body>
</html>
